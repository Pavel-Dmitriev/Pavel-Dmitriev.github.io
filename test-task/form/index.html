<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="form">
      <div class="form__header">
        <h1 class="form__title">Заполните поля</h1>
        <span class="form__note">ну пожалуйста</span>
      </div>
      <form action="#" method="post" class="form__body">
        <section class="form__section">
          <h2 class="form__section-title">Основное</h2>
          <div class="form__group">
            <label for="name" class="form__label">Имя</label>
            <input
              type="text"
              class="form__input"
              id="name"
              placeholder="по паспорту"
            />
          </div>
          <div class="form__group" style="margin-bottom: 0">
            <label class="form__label">Цвет вашего настроения</label>
            <div class="form__dropdown">
              <input
                type="hidden"
                name="color"
                value="red"
                style="display: none"
                id="colorValue"
              />
              <button
                type="button"
                class="form__dropdown-toggle"
                id="colorToggle"
                style="background-color: red"
              ></button>
              <div class="form__dropdown-menu" id="colorMenu" hidden>
                <button
                  type="button"
                  class="form__color-chip form__color-chip--red is-active"
                  style="background-color: red"
                ></button>
                <button
                  type="button"
                  class="form__color-chip form__color-chip--green"
                  style="background-color: green"
                ></button>
                <button
                  type="button"
                  class="form__color-chip form__color-chip--blue"
                  style="background-color: blue"
                ></button>
              </div>
            </div>
          </div>
        </section>

        <section class="form__section">
          <h2 class="form__section-title">Дополнительное</h2>
          <div class="form__group">
            <label for="comment" class="form__label" style="align-self: start"
              >Комментарий</label
            >
            <textarea
              class="form__textarea"
              id="comment"
              rows="3"
              placeholder="Напишите хоть что-нибудь. Если хотите, конечно."
            ></textarea>
          </div>
          <div class="form__check">
            <div></div>
            <div class="form__check-item">
              <label class="form__choice form__choice--radio" for="radio">
                <input
                  type="checkbox"
                  class="form__checkbox-input"
                  id="radio"
                  name="choice"
                />
                <span class="form__choice-mark"></span>
                <span class="form__choice-label"
                  >Ну а тут просто полежит радиобатон</span
                >
              </label>
              <label class="form__choice form__choice--checkbox" for="checkbox">
                <input
                  type="checkbox"
                  class="form__checkbox-input"
                  id="checkbox"
                  name="agree"
                />
                <span class="form__choice-mark"></span>
                <span class="form__choice-label"
                  >Соглашаюсь на все, что вы не придумали и осознаю, что это
                  может означать <a href="#something">что угодно</a></span
                >
              </label>
            </div>
          </div>
        </section>

        <div class="form__footer">
          <div></div>
          <div>
            <button type="submit" class="form__button form__button--primary">
              Отправить все мои данные
            </button>
          </div>
        </div>
      </form>
    </section>
    <script>
      const form = document.querySelector(".form__body");
      const dropdownToggle = document.getElementById("colorToggle");
      const dropdownMenu = document.getElementById("colorMenu");
      const colorInput = document.getElementById("colorValue");
      const nameInput = document.getElementById("name");
      const commentInput = document.getElementById("comment");
      const radioInput = document.getElementById("radio");
      const checkboxInput = document.getElementById("checkbox");

      const colorButtons = dropdownMenu.querySelectorAll(".form__color-chip");

      function updateSelected(button) {
        colorButtons.forEach((item) => item.classList.remove("is-active"));
        button.classList.add("is-active");
        const color = button.style.backgroundColor;
        colorInput.value = color;
        dropdownToggle.style.backgroundColor = color;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        console.log({
          name: nameInput.value,
          color: colorInput.value,
          comment: commentInput.value,
          choice: radioInput.checked,
          agree: checkboxInput.checked,
        });
      });

      dropdownToggle.addEventListener("click", () => {
        const isOpen = !dropdownMenu.hidden;
        dropdownMenu.hidden = isOpen;
      });

      colorButtons.forEach((button) => {
        button.addEventListener("click", () => {
          updateSelected(button);
          dropdownMenu.hidden = true;
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".form__dropdown")) {
          dropdownMenu.hidden = true;
        }
      });
    </script>
  </body>
</html>
