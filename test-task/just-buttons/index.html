<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Just Buttons</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="buttons-container">
      <div class="button-block">
        <div class="button-type">
          <label class="button-type__label">Первый тип</label>
          <div class="button-type__column">
            <button class="btn btn--primary">Просмотреть</button>
            <button class="btn btn--primary" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--primary" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--primary" disabled>Просмотреть</button>
          </div>
        </div>

        <div class="button-type">
          <label class="button-type__label">Второй тип</label>
          <div class="button-type__column">
            <button class="btn btn--border-red">Просмотреть</button>
            <button class="btn btn--border-red" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--border-red" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--border-red" disabled>Просмотреть</button>
          </div>
        </div>

        <div class="button-type">
          <label class="button-type__label">Третий тип</label>
          <div class="button-type__column">
            <button class="btn btn--filled-red">Просмотреть</button>
            <button class="btn btn--filled-red" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--filled-red" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--filled-red" disabled>Просмотреть</button>
          </div>
        </div>

        <div class="button-type">
          <label class="button-type__label">Четвертый тип</label>
          <div class="button-type__column">
            <button class="btn btn--arrow">Просмотреть</button>
            <button class="btn btn--arrow" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--arrow" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--arrow" disabled>Просмотреть</button>
          </div>
        </div>

        <div class="button-type">
          <label class="button-type__label">Пятый тип</label>
          <div class="button-type__column">
            <button class="btn btn--filled-green">Просмотреть</button>
            <button class="btn btn--filled-green" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--filled-green" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--filled-green" disabled>Просмотреть</button>
          </div>
        </div>

        <div class="button-type">
          <label class="button-type__label">Шестой тип</label>
          <div class="button-type__column">
            <button class="btn btn--border-green">Просмотреть</button>
            <button class="btn btn--border-green" data-state="hover">
              Просмотреть
            </button>
            <button class="btn btn--border-green" data-state="active">
              Просмотреть
            </button>
            <button class="btn btn--border-green" disabled>Просмотреть</button>
          </div>
        </div>
        <div class="icon-button-block">
          <div class="icon-button-block__row">
            <button class="btn btn--primary">
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M11.5 1.5 14.5 4.5 5 14H2V11L11.5 1.5Z" />
              </svg>
              Редактировать
            </button>
            <button class="btn btn--primary">
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 1v10" />
                <path d="m4 7 4-4 4 4" />
                <path d="M2 13v1h12v-1" />
              </svg>
              Выгрузить в Excel
            </button>
            <button class="btn btn--primary">
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              >
                <path d="m4 4 8 8M12 4l-8 8" />
              </svg>
              Удалить список
            </button>
            <button class="btn btn--primary">
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 6V2h8v4" />
                <path d="M3 9.5h10" />
                <path d="M3 11v3h10v-3" />
                <path
                  d="M14 9.5a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v2.5a1 1 0 0 0 1 1H3"
                />
              </svg>
              Распечатать
            </button>
            <button class="btn btn--primary">
              <svg
                width="1em"
                height="1em"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M8 1v10" />
                <path d="m4 7 4 4 4-4" />
                <path d="M2 13v1h12v-1" />
              </svg>
              Загрузить из файла
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
